plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'prac'
version = '0.0.1-SNAPSHOT'
description = 'backend-assingment'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' } // 스프링 마일스톤 버전 사용 시
    maven { url 'https://repo.spring.io/snapshot' }   // 스프링 스냅샷 버전 사용 시
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2'
    testRuntimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation platform('com.google.cloud:spring-cloud-gcp-dependencies:7.4.3') // 최신 안정 버전으로 대체
    implementation 'com.google.cloud:spring-cloud-gcp-starter-secretmanager'
}

tasks.named('test') {
    useJUnitPlatform()
}
