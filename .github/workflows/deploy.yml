name: CI/CD Pipeline to GCP VM

on:
  push:
    branches: [ "main" ]

env:
  # GCP 및 이미지 관련 환경 변수 설정 (Secrets에서 가져온 값을 env 변수로 재정의)
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }} # secrets에서 가져와 env에 정의
  GCP_ZONE: ${{ secrets.GCP_ZONE }}             # secrets에서 가져와 env에 정의
  GAR_LOCATION: us-east1
  REPOSITORY: my-repo
  IMAGE_NAME: my-app
  MIG_NAME: was-group
  SERVICE_NAME: was

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      #추가한 부분
      - name: Set up Pem
        run: |
          mkdir -p src/main/resources/redis
          echo "${{ secrets.GCP_PEM }}" | base64 --decode > src/main/resources/redis/server-ca.pem

      # 3. Gradle 캐싱 설정 (빌드 속도 향상)
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. (추가됨) Gradle 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. GCP 인증 (Key File 없이!)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # 6. (추가됨) 유닛 테스트 실행
      - name: Run tests with Gradle
        run: ./gradlew test

      # 7. Docker 인증 설정
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      # 8. 이미지 빌드 및 푸시 (테스트 스킵)
      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          FULL_IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          docker build -t $FULL_IMAGE .
          docker push $FULL_IMAGE
          
          echo "FULL_IMAGE=$FULL_IMAGE" >> $GITHUB_ENV

      # 9. startup.sh 파일 수정 (이미지 태그 치환)
      # sed 명령어로 {{IMAGE_NAME}}을 방금 빌드한 이미지 주소로 바꿔치기 합니다.
      - name: Prepare Startup Script
        run: |
          sed -i "s|{{IMAGE_NAME}}|${{ env.FULL_IMAGE }}|g" scripts/startup.sh

      # 10. 새 인스턴스 템플릿 생성
      # --metadata-from-file 옵션이 핵심입니다! 파일 내용을 그대로 읽어서 전송하므로 이스케이프 문제 해결.
      - name: Create New Instance Template
        run: |
          TEMPLATE_NAME="${{ env.SERVICE_NAME }}-template-${{ github.sha }}"
          
          gcloud compute instance-templates create $TEMPLATE_NAME \
            --project=${{ env.GCP_PROJECT_ID }} \
            --machine-type=e2-micro \
            --boot-disk-type=pd-standard \
            --boot-disk-size=30GB \
            --image-family=cos-stable \
            --image-project=cos-cloud \
            --region=${{ env.GAR_LOCATION }} \
            --instance-template-region=${{ env.GAR_LOCATION }}  \
            --network-interface=network=myvpc,subnet=testsubnet,no-address \
            --tags=was \
            --service-account=${{ secrets.GCP_VM_SERVICE_ACCOUNT }} \
            --scopes=https://www.googleapis.com/auth/cloud-platform \
            --metadata-from-file=startup-script=scripts/startup.sh
      
          echo "TEMPLATE_NAME=$TEMPLATE_NAME" >> $GITHUB_ENV

      # 7. MIG 롤링 업데이트 시작
      - name: Start Rolling Update
        run: |
          gcloud compute instance-groups managed rolling-action start-update ${{ env.MIG_NAME }} \
            --version=template=projects/${{ env.GCP_PROJECT_ID }}/regions/${{ env.GAR_LOCATION }}/instanceTemplates/${{ env.TEMPLATE_NAME }} \
            --zone=${{ env.GCP_ZONE }} \
            --max-surge=1 \
            --max-unavailable=0