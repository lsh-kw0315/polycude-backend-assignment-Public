name: CI/CD Pipeline to GCP VM

on:
  push:
    branches: [ "main" ]

env:
  # GCP 및 이미지 관련 환경 변수 설정 (Secrets에서 가져온 값을 env 변수로 재정의)
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }} # secrets에서 가져와 env에 정의
  GCP_ZONE: ${{ secrets.GCP_ZONE }}             # secrets에서 가져와 env에 정의
  GAR_LOCATION: us-east1
  REPOSITORY: my-repo
  IMAGE_NAME: my-app
  VM_INSTANCE_NAME: ${{ secrets.GCP_VM_NAME }}  # secrets에서 가져와 env에 정의

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode TrustStore JKS
        run: |
          mkdir -p src/main/resources # truststore.jks가 있어야 할 경로 (빌드 시)
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > src/main/resources/truststore.jks
        shell: bash # Windows 러너 사용 시 Powershell 스크립트로 변경

      # 3. Gradle 캐싱 설정 (빌드 속도 향상)
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. (추가됨) Gradle 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. GCP 인증 (Key File 없이!)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # 6. (추가됨) 유닛 테스트 실행
      - name: Run tests with Gradle
        run: ./gradlew test

      # 7. Docker 인증 설정
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      # 8. 이미지 빌드 및 푸시 (테스트 스킵)
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

  # 9. VM에 배포 (IAP 터널링 사용)
      - name: Deploy to VM
        run: |
          gcloud compute ssh ${{ env.VM_INSTANCE_NAME }} --zone ${{ env.GCP_ZONE }} --tunnel-through-iap --command "
            # VM 내부에서 실행될 명령어들
            gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet
          
            docker pull ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          
            docker stop ${{ env.IMAGE_NAME }} || true
            docker rm ${{ env.IMAGE_NAME }} || true
          
            docker run -d --restart always --name ${{ env.IMAGE_NAME }} -e KEYSTORE_PW=${{ secrets.KEYSTORE_PW }} -p 8080:8080 ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          "