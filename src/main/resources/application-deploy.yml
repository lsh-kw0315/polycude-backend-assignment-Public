spring:
  config:
    import: "gcp:secretmanager:/"
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${sm://db-url}
    username: ${sm://db-username}
    password: ${sm://db-password}

  cloud:
    gcp:
      project-id: ${sm://project-id}