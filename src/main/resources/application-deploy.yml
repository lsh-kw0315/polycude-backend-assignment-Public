spring:
  cloud:
    gcp:
      project-id: aerial-velocity-485514-i8
  config:
    import: "sm@"
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${sm@db-url}
    username: ${sm@db-username}
    password: ${sm@db-password}
