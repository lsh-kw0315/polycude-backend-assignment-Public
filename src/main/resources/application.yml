spring:
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        show_sql: true
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:~/assignment
    username: sa
    password:
  cloud:
    gcp:
      sql:
        enabled: false